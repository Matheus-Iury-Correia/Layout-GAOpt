name: ci
on:
  push:
    branches: ["agent/**", "develop"]
  pull_request:
    branches: ["develop", "main"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python tools/verify.py
